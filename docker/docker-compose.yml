services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    user: root
    command: start --user root --pass root --bind 0.0.0.0:8000 surrealkv:///data/quorum.db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  surreal_data:
  minio_data: