[workspace]
resolver = "2"
members = [
    "quorum-core",
    "quorum-public",
    "quorum-private",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio", "http1", "macros", "tower-log", "tracing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
surrealdb = { version = "3.1.5", default-features = false, features = ["kv-rocksdb"] }
surrealdb-types = "3.1.5"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
jsonwebtoken = "10.4.0"
http = "1.4.2"
colored = "3.1.1"
arc-swap = "1.9.1"
rand_core = { version = "0.6", features = ["std"] }
hex = "0.4.3"
argon2 = { version = "0.5.3", features = ["std"] }
dialoguer = "0.12.0"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "set-header"] }
tower_governor = "0.8.0"
rpassword = "7.5.4"
zeroize = "1.9.0"
aes-gcm = "0.10.3"
sha2 = "0.11.0"
rand = "0.10.1"
email_address = "0.2.9"
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
zxcvbn = "3.1.1"

[profile.dev]
opt-level = 1
lto = false
codegen-units = 256
debug = 0
incremental = true

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"