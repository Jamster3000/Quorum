[package]
name = "quorum-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full", "signal"] }
surrealdb = { version = "3.1.5", features = ["protocol-ws"] }
surrealdb-types = "3.1.5"
tracing = "0.1.44"
chrono = "0.4.45"
jsonwebtoken = "10.4.0"
http = "1.4.2"
colored = "3.1.1"
arc-swap = "1.9.1"
aes-gcm = "0.10.3"
rand_core = { version = "0.6", features = ["std"] }
dialoguer = "0.12.0"
hex = "0.4.3"
argon2 = { version = "0.5.3", features = ["std"] }
zeroize = "1.9.0"