[package]
name = "quorum-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full", "signal"] }
surrealdb = { version = "3", features = ["protocol-ws"] }
surrealdb-types = "3.0.5"
tracing = "0.1.44"
chrono = "0.4"
jsonwebtoken = "10.3.0"
http = "1.1"
colored = "2.1"
arc-swap = "1.5.0"