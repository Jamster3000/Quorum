[package]
name = "Quorum-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full", "signal"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15"
surrealdb = { version = "3", features = ["protocol-ws"] }
colored = "2.1"
surrealdb-types = "3.0.5"

[profile.dev]
opt-level = 2
lto = false
codegen-units = 256