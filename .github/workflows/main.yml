name: Rust CI
on:
  push:
    paths:
      - 'server/**'
      - 'client/src-tauri/**'
      - '.github/workflows/rust-backend-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/src-tauri/**'
      - '.github/workflows/rust-backend-ci.yml'
permissions:
  contents: write
  pages: write
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            client/src-tauri -> target

      # ===== SERVER CI =====
      - name: Check server formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Run server Clippy
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -W warnings

      - name: Generate server docs
        working-directory: server
        run: cargo doc --no-deps --document-private-items --workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      # ===== CLIENT CI =====
      - name: Check client formatting
        working-directory: client/src-tauri
        run: cargo fmt --all -- --check

      - name: Run client Clippy
        working-directory: client/src-tauri
        run: cargo clippy --all-targets --all-features -- -W warnings

      - name: Generate TypeScript docs
        working-directory: client
        run: |
          npm ci
          npx svelte-kit sync
          npx typedoc --out ../docs-client --entryPointStrategy expand --tsconfig tsconfig.typedoc.json --skipErrorChecking src/lib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Generate client docs
        working-directory: client/src-tauri
        run: cargo doc --no-deps --document-private-items --lib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      # ===== DOCUMENTATION DEPLOYMENT =====
      - name: Prepare docs directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs-out/server
          mkdir -p docs-out/client
          mkdir -p docs-out/client-ts
          cp -r server/target/doc/* docs-out/server/ || true
          cp -r client/src-tauri/target/doc/* docs-out/client/ || true
          cp -r docs-client/* docs-out/client-ts/ || true

      - name: Create root index page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > docs-out/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Quorum Documentation</title>
            <style>
              :root {
                --bg: #1e1f22;
                --bg-elevated: #26282c;
                --border: #34363b;
                --text: #e7e8ea;
                --text-dim: #9a9da3;
                --teal: #178070;
                --violet: #8b7cf8;
              }
              * { 
                  box-sizing: border-box;
                }
              html, body {
                overflow-y: hidden;
              }
              
              body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--text);
                font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 4rem 1.5rem 3rem;
              }
              
              header {
                text-align: center;
                max-width: 640px;
                margin-bottom: 3rem;
                opacity: 0;
                animation: fadeInUp 0.6s ease forwards;
              }
              
              h1 {
                font-size: 2.25rem;
                margin: 0 0 0.75rem;
                background: linear-gradient(90deg, var(--teal), var(--violet));
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: shimmer 6s ease-in-out infinite;
              }
              
              header p { 
                  color: var(--text-dim); 
                  line-height: 1.6; margin: 0; 
              }
              
              main {
                width: 100%;
                max-width: 960px;
              }
              
              .grid {
                display: grid;
                gap: 1.25rem;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                width: 100%;
              }
              
              .card {
                background: var(--bg-elevated);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.75rem;
                text-decoration: none;
                color: var(--text);
                transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                opacity: 0;
                animation: fadeInUp 0.5s ease forwards;
              }
              
              .grid .card:nth-child(1) { 
                  animation-delay: 0.05s; 
              }
              
              .grid .card:nth-child(2) { 
                  animation-delay: 0.15s; 
              }
              
              .grid .card:nth-child(3) { 
                  animation-delay: 0.25s; 
              }
              
              .card:hover {
                border-color: var(--teal);
                transform: translateY(-4px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px color-mix(in srgb, var(--teal) 40%, transparent);
              }
              
              .card .crate-name {
                font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
                font-size: 1.05rem;
                font-weight: 600;
                color: var(--teal);
                transition: color 0.25s ease;
              }
              
              .card p { 
                  color: var(--text-dim); 
                  font-size: 0.92rem; 
                  line-height: 1.55; 
                  margin: 0; 
                  flex: 1; 
              }
              
              .card .view-link {
                font-size: 0.85rem;
                color: var(--violet);
                font-weight: 600;
                transition: transform 0.25s ease;
              }
              
              .card:hover .view-link { transform: translateX(4px); }
              .section-title {
                font-size: 0.85rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--text-dim);
                margin: 2rem 0 1rem;
                padding: 0 0.25rem;
                opacity: 0;
                animation: fadeInUp 0.5s ease forwards;
              }
              
              .section-title:first-child { margin-top: 0; }
              footer {
                margin-top: 3rem;
                color: var(--text-dim);
                font-size: 0.8rem;
                text-align: center;
                opacity: 0;
                animation: fadeInUp 0.6s ease 0.4s forwards;
              }
              
              footer a {
                color: var(--violet);
                text-decoration: none;
                transition: color 0.2s ease;
              }
              
              footer a:hover { color: var(--teal); text-decoration: underline; }

              @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(12px); }
                to { opacity: 1; transform: translateY(0); }
              }
              @keyframes shimmer {
                0%, 100% { background-position: 0% center; }
                50% { background-position: 100% center; }
              }
            </style>
          </head>
          <body>
            <header>
              <h1>Quorum Documentation</h1>
              <p>Documentation for Quorum server and client frontend</p>
            </header>
            <main>
              <div class="section-title">Backend Server</div>
              <div class="grid">
                <a class="card" href="server/quorum_core/index.html">
                  <span class="crate-name">Quorum Core</span>
                  <p>shared library: Includes code that is shared between the public and private server.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
                <a class="card" href="server/quorum_public/index.html">
                  <span class="crate-name">Quorum Public</span>
                  <p>Public server: Includes code only for the public server (e.g., authetication)</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
                <a class="card" href="server/quorum_private/index.html">
                  <span class="crate-name">Quorum Private</span>
                  <p>Private server: Includes code only for the private server.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
              </div>
              <div class="section-title">Desktop Client</div>
              <div class="grid">
                <a class="card" href="client/quorum_lib/index.html">
                  <span class="crate-name">Quorum client Backend</span>
                <p>Tauri rust backend. Documentation for all the rust code on the Tauri clientside.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
                <a class="card" href="client-ts/index.html">
                  <span class="crate-name">Quorum Client Frontend</span>
                  <p>Docuemntation for frontend Typescript.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
              </div>
            </main>
            <footer>
              Generated from <a href="https://github.com/jamster3000/Quorum">github.com/jamster3000/Quorum</a>
            </footer>
          </body>
          </html>
          EOF

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-out
          publish_branch: gh-pages
          force_orphan: false
