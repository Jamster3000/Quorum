name: Rust backend CI
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/rust-backend-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/rust-backend-ci.yml'
permissions:
  contents: write
  pages: write
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target

      - name: Check formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -W warnings

      - name: Generate docs for all crates
        working-directory: server
        run: cargo doc --no-deps --document-private-items --workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Create root index page
        run: |
          mkdir -p server/target/doc
          cat > server/target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Quorum Documentation</title>
          </head>
          <body>
            <h1>Quorum Documentation</h1>
            <ul>
              <li><a href="quorum_core/index.html">Quorum Core</a></li>
              <li><a href="quorum_public/index.html">Quorum Public</a></li>
              <li><a href="quorum_private/index.html">Quorum Private</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: server/target/doc
          publish_branch: gh-pages
          force_orphan: false
