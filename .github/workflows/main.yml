name: Rust CI
on:
  push:
    paths:
      - 'server/**'
      - 'client/src-tauri/**'
      - '.github/workflows/rust-backend-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/src-tauri/**'
      - '.github/workflows/rust-backend-ci.yml'
permissions:
  contents: write
  pages: write
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            client/src-tauri -> target

      # ===== SERVER CI =====
      - name: Check server formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Run server Clippy
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -W warnings

      - name: Generate server docs
        working-directory: server
        run: cargo doc --no-deps --document-private-items --workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      # ===== CLIENT CI =====
      - name: Check client formatting
        working-directory: client/src-tauri
        run: cargo fmt --all -- --check

      - name: Run client Clippy
        working-directory: client/src-tauri
        run: cargo clippy --all-targets --all-features -- -W warnings

      - name: Generate TypeScript docs
        working-directory: client
        run: |
          npm ci
          npx svelte-kit sync
          npx typedoc --out ../docs-client --entryPointStrategy expand src/lib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Generate client docs
        working-directory: client/src-tauri
        run: cargo doc --no-deps --document-private-items --lib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      # ===== DOCUMENTATION DEPLOYMENT =====
      - name: Prepare docs directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs-out/server
          mkdir -p docs-out/client
          mkdir -p docs-out/client-ts
          cp -r server/target/doc/* docs-out/server/ || true
          cp -r client/src-tauri/target/doc/* docs-out/client/ || true
          cp -r docs-client/* docs-out/client-ts/ || true

      - name: Create root index page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > docs-out/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Quorum Documentation</title>
            <style>
              :root {
                --bg: #1e1f22;
                --bg-elevated: #26282c;
                --border: #34363b;
                --text: #e7e8ea;
                --text-dim: #9a9da3;
                --teal: #178070;
                --violet: #8b7cf8;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--text);
                font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 4rem 1.5rem;
              }
              header { text-align: center; max-width: 640px; margin-bottom: 3rem; }
              h1 {
                font-size: 2.25rem;
                margin: 0 0 0.75rem;
                background: linear-gradient(90deg, var(--teal), var(--violet));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
              }
              header p { color: var(--text-dim); line-height: 1.6; margin: 0; }
              .grid {
                display: grid;
                gap: 1.25rem;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                max-width: 960px;
                width: 100%;
              }
              .card {
                background: var(--bg-elevated);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.75rem;
                text-decoration: none;
                color: var(--text);
                transition: border-color 0.15s ease, transform 0.15s ease;
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
              }
              .card:hover {
                border-color: var(--teal);
                transform: translateY(-2px);
              }
              .card .crate-name {
                font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
                font-size: 1.05rem;
                font-weight: 600;
                color: var(--teal);
              }
              .card p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.55; margin: 0; flex: 1; }
              .card .view-link { font-size: 0.85rem; color: var(--violet); font-weight: 600; }
              .section-title {
                font-size: 0.85rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--text-dim);
                margin: 2rem 0 1rem;
                padding: 0 1.5rem;
              }
              .section-title:first-child { margin-top: 0; }
              footer { margin-top: 3rem; color: var(--text-dim); font-size: 0.8rem; text-align: center; }
              footer a { color: var(--violet); text-decoration: none; }
              footer a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <header>
              <h1>Quorum Documentation</h1>
              <p>Rustdoc reference for Quorum's workspace — backend server and client binaries.</p>
            </header>
            <main>
              <div class="section-title">Backend Server</div>
              <div class="grid">
                <a class="card" href="server/quorum_core/index.html">
                  <span class="crate-name">quorum-core</span>
                  <p>Shared library: groups, channels, messages, permissions, and JWT verification used by both server binaries.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
                <a class="card" href="server/quorum_public/index.html">
                  <span class="crate-name">quorum-public</span>
                  <p>Public server binary. Adds signup/login, account management, JWT signing, and the users table on top of quorum-core.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
                <a class="card" href="server/quorum_private/index.html">
                  <span class="crate-name">quorum-private</span>
                  <p>Self-hosted private server binary. Depends only on quorum-core — no signup code or users table exists in this crate.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
              </div>
              <div class="section-title">Desktop Client</div>
              <div class="grid">
                <a class="card" href="client/quorum_lib/index.html">
                  <span class="crate-name">quorum-lib</span>
                  <p>Tauri backend library. Handles commands, auth, state management, and desktop API integrations for the SvelteKit frontend.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
              </div>
              <div class="section-title">Frontend (TypeScript + Svelte)</div>
              <div class="grid">
                <a class="card" href="client-ts/index.html">
                  <span class="crate-name">Client Frontend</span>
                  <p>TypeScript utilities, Svelte components, and SvelteKit routes for the Quorum desktop client UI.</p>
                  <span class="view-link">View docs &rarr;</span>
                </a>
              </div>
            </main>
            <footer>
              Generated from <a href="https://github.com/iamster3000/Quorum">github.com/iamster3000/Quorum</a>
            </footer>
          </body>
          </html>
          EOF

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-out
          publish_branch: gh-pages
          force_orphan: false